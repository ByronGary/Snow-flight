apiVersion: apps/v1
kind: Deployment
metadata:
  name: snow-flights
  labels:
    app: snow-flights
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snow-flights
  template:
    metadata:
      labels:
        app: snow-flights
    spec:
      containers:
        - name: snow-flights
          image: your-registry/snow-flights:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: snow-flights
  labels:
    app: snow-flights
spec:
  type: ClusterIP
  selector:
    app: snow-flights
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP