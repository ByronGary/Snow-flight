apiVersion: apps/v1
kind: Deployment
metadata:
  name: snow-flights
  labels:
    app: snow-flights
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snow-flights
  template:
    metadata:
      labels:
        app: snow-flights
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: snow-flights
          image: snow-flights   # tag set by kustomization.yaml `images:`
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SNOW_FLIGHTS_CACHE_DIR
              value: /tmp/cache
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: snow-flights
  labels:
    app: snow-flights
spec:
  type: ClusterIP
  selector:
    app: snow-flights
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
