name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pgeocode
          key: pgeocode-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pgeocode
          key: pgeocode-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t snow-flights:ci .
      - name: Smoke test (read-only root filesystem, non-root)
        run: |
          docker run -d --name sf --read-only --tmpfs /tmp --cap-drop ALL -p 8000:8000 snow-flights:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          curl -sf "http://localhost:8000/api/airports/nearby?zip=80302" | grep -q '"DEN"'
          docker logs sf
