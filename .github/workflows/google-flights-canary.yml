# Weekly check that Google Flights still renders the links we build (tfs format).
# Google sometimes throttles scripted requests, so a failure means "open the URL from the
# log in a browser", not necessarily that the format changed.
name: Google Flights canary

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m network -v
