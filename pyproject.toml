[project]
name = "snow-flights"
version = "0.2.0"
description = "Ski resort weather, powder alerts, and Google Flights search for Ikon and Epic pass holders."
requires-python = ">=3.12"
license = "MIT"
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: talks to real external services (run with -m network)"]
filterwarnings = ["ignore::UserWarning:pgeocode"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
